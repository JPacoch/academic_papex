project:
  type: default
  output-dir: build
  render:
    - index.qmd
  resources:
    - images/**
  # Move keep-tex output into build/ after rendering
  post-render:
    - python3 scripts/check_images.py --move-tex

# Bibliography
bibliography: references.bib
csl: ieee.csl
cite-method: citeproc

# Cross-referencing
crossref:
  fig-title: "Fig."
  fig-prefix: "Fig."
  tbl-title: "Table"
  tbl-prefix: "Table"
  eq-prefix: "Eq."
  sec-prefix: "Section"
  thm-prefix: "Theorem"
  lem-prefix: "Lemma"
  def-prefix: "Definition"

# PDF output
format:
  pdf:
    documentclass: scrartcl
    classoption:
      - paper=a4
      - fontsize=11pt
    pdf-engine: pdflatex
    keep-tex: true
    number-sections: true
    colorlinks: true
    linkcolor: blue
    citecolor: blue
    urlcolor: teal
    geometry:
      - margin=25mm
    fig-pos: "htbp"
    tbl-pos: "htbp"
    include-in-header:
      - latex/preamble.tex
    template-partials:
      - latex/before-body.tex
