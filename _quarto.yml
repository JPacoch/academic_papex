project:
  type: default
  output-dir: build
  render:
    - index.qmd
  resources:
    - images/**
  # Quarto writes `keep-tex` into the project root when `output-dir` is set;
  # move it cleanly into `build/` so standalone `quarto render` matches `make build`.
  post-render:
    - python3 scripts/check_images.py --move-tex

# --- Bibliography & Citation Style --------------------------------------------
# `citeproc` + `csl: ieee.csl` guarantees zero BibTeX/Biber pass errors and a
# self-contained `.tex` output. To swap styles (ACM, Elsevier, Copernicus, etc.),
# replace `csl:` with another CSL file, OR switch to native LaTeX citations:
#   cite-method: natbib
#   biblio-style: IEEEtran
bibliography: references.bib
csl: ieee.csl
cite-method: citeproc

# --- Unified Cross-Referencing ------------------------------------------------
crossref:
  fig-title: "Fig."
  fig-prefix: "Fig."
  tbl-title: "Table"
  tbl-prefix: "Table"
  eq-prefix: "Eq."
  sec-prefix: "Section"
  thm-prefix: "Theorem"
  lem-prefix: "Lemma"
  def-prefix: "Definition"

# --- PDF & LaTeX Export Configuration -----------------------------------------
format:
  pdf:
    # Standard single-column academic preprint class (swap to IEEEtran, acmart,
    # elsarticle, or copernicus when preparing camera-ready submission).
    documentclass: scrartcl
    classoption:
      - paper=a4
      - fontsize=11pt
    pdf-engine: pdflatex
    keep-tex: true
    number-sections: true
    colorlinks: true
    linkcolor: blue
    citecolor: blue
    urlcolor: teal
    geometry:
      - margin=25mm
    fig-pos: "htbp"
    tbl-pos: "htbp"
    include-in-header:
      - latex/preamble.tex
    template-partials:
      - latex/before-body.tex
